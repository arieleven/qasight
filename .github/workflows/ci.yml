name: ci

# Unified CI/CD pipeline: format and test in parallel -> deploy
#
# Stages:
#   format               ruff lint + ruff format check + mypy + import-linter layer contracts + zizmor (all blocking)
#   security             gitleaks over the whole history, Bandit (medium+), pip-audit on every
#                        extra's dependencies (all blocking); the frontend job runs npm audit
#   test                 fast required pytest suite with the coverage gate, then the
#                        heavy (local, mocked) tier; uploads coverage.xml
#   test_python_versions the same suite on Python 3.12, 3.13 and 3.14, the other versions
#                        pyproject.toml lists (no coverage gate, not a required check)
#   frontend             React dashboard: typecheck, ESLint, generated API types up to date,
#                        vitest unit tests, production build
#   changelog_required    PR-only: fails if non-doc changes don't touch CHANGELOG.md
#                          (escape hatch: 'no-changelog' PR label)
#   docs_vault           lints the docs/ vault against docs/CLAUDE.md (frontmatter,
#                        links, orphans; on PRs also the `updated` date)
#   docs_site            builds the MkDocs site from docs/ with --strict (broken links fail)
#   getting_started      runs examples/getting-started through the GitHub Action, the
#                        way docs/Getting Started.md tells a new user to
#   github_action        runs this checkout's code through the GitHub Action and, on
#                        pull requests, posts its run summary as a PR comment
#   team_server          builds the team server image, starts it with Postgres
#                        (deploy/server/docker-compose.yml) and uploads JUnit XML to it
#                        with `qasight ingest --server` (scripts/team_server_smoke.sh)
#   package              builds the sdist and wheel, `twine check --strict`, then installs
#                        the wheel with no extras and runs a cycle (scripts/package_smoke.sh)
#   deploy               builds the distributable wheel on a published release
#
# Code review is handled by a local pre-push hook (.claude/settings.json),
# not by CI -- see 990be121 for why the earlier CI-based review was dropped.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main]
  release:
    types: [published]

# Cancel superseded runs on the same ref so we never pay for stale test runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy needs the real dependencies (SQLModel, Rich, FastAPI, ...) to
      # check against their types instead of treating them as Any.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check --diff .
      - name: mypy
        run: mypy qasight qasight_api
      - name: Layer check (import-linter)
        run: lint-imports
      # Workflow security (pinned actions, template injection, cache poisoning,
      # credentials); accepted findings are listed in .github/zizmor.yml.
      - name: Workflow audit (zizmor)
        run: |
          python -m pip install zizmor==1.32.0
          zizmor --offline --min-severity=medium .github/workflows/ action.yml integrations/github-action/action.yml

  # Third-party checks that are fast enough for every pull request. The slow
  # ones (API fuzzing, ZAP, Lighthouse, load, mutation testing) run in
  # release-gate.yml before a release. See docs/Specs & ADRs/Release Gate - 2026-11-12.md.
  security:
    name: security (gitleaks, bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Every commit, not just the tree: a secret added and then deleted is still leaked.
      # Fake tokens in the redaction tests are allowed in .gitleaks.toml.
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
      # Reviewed exceptions carry a `# nosec <id>` comment with the reason.
      - name: Python code (Bandit)
        run: |
          python -m pip install bandit==1.9.4
          bandit -q -r qasight qasight_api --severity-level medium --confidence-level medium
      - name: Python dependencies (pip-audit)
        run: |
          # The runner image ships an old setuptools; audit what we install, not the image.
          python -m pip install --upgrade pip setuptools
          python -m pip install ".[bdd,api,db,db_mysql,metrics,otel,export,mcp]" pip-audit==2.10.1
          pip-audit --progress-spinner off --skip-editable

  # No `needs: format`: lint and tests run side by side, so a red lint no
  # longer hides a red test for another minute.
  test:
    name: test (fast required)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Coverage sources (qasight + qasight_api, line + branch) and the 80%
      # gate come from pytest.ini; measuring costs ~15 s on this suite.
      - name: Run fast required suite (with coverage gate)
        run: python -m pytest -q -n auto -m "tier_fast and not quarantined" --maxfail=1 --cov-report=xml
      # The heavy tier is local and mocked and takes a few seconds; running it
      # here keeps it from rotting between manual pr-heavy runs.
      - name: Run heavy suite
        run: python -m pytest -q -m "tier_heavy and not tier_external and not quarantined" --maxfail=1 --no-cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      # frontend/openapi.json is the contract the React app's types are
      # generated from; fail if a Pydantic model changed without re-exporting.
      - name: OpenAPI schema up to date
        run: python scripts/export_openapi.py --check
      # schema/qasight.schema.json is what editors load for config
      # autocomplete; fail if qasight/config changed without re-exporting.
      - name: Config JSON Schema up to date
        run: python scripts/export_config_schema.py --check
      - name: Upload diagnostics artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-artifacts
          path: |
            .artifacts/e2e/**
            **/*.log
            **/*summary*.json
            **/*api*.json
            **/*.png

  test_python_versions:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run fast required suite
        run: python -m pytest -q -n auto -m "tier_fast and not quarantined" --maxfail=1 --no-cov

  frontend:
    name: frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # What ships to users; the dev tree (eslint, vitest) is audited in release-gate.yml.
      - name: Dependency audit (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Generated API types up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-schema.ts || {
            echo "::error::src/lib/api-schema.ts is stale. Run 'npm --prefix frontend run gen:api' and commit the result."
            exit 1
          }
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  # Dependabot PRs are skipped by author, not only by label: Dependabot adds
  # its `no-changelog` label just after opening the PR, so the `opened` event
  # sometimes carries no labels and this job failed on a dependency bump.
  changelog_required:
    name: changelog required
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require CHANGELOG.md update
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # No --depth here: a shallow fetch into this full clone cuts the base
          # branch's history, so `base...HEAD` finds no merge base once the base
          # has moved on (seen on fork pull requests).
          git fetch origin "$BASE_REF"
          changed_files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"
          echo "$changed_files"
          if echo "$changed_files" | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md was updated."
            exit 0
          fi
          non_doc_changes=$(echo "$changed_files" | grep -vE '^(docs/|\.github/|.*\.md$)' || true)
          if [ -z "$non_doc_changes" ]; then
            echo "No non-doc changes in this PR; CHANGELOG.md update not required."
            exit 0
          fi
          echo "::error::This PR changes code but does not update CHANGELOG.md. Add an entry under [Unreleased], or apply the 'no-changelog' label if this change doesn't warrant one."
          exit 1

  docs_vault:
    name: docs vault lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Rules live in docs/CLAUDE.md: frontmatter, no broken links, no
      # wikilinks, no orphan notes. Stdlib only, so nothing to install.
      - name: Lint the vault
        if: github.event_name != 'pull_request'
        run: python scripts/docs_vault.py lint
      # On pull requests also require `updated` to move on every edited note.
      - name: Lint the vault (with updated-date check)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          python scripts/docs_vault.py lint --base "origin/${BASE_REF}"

  docs_site:
    name: docs site (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install MkDocs
        run: python -m pip install -e ".[docs]"
      - name: Build the site
        run: mkdocs build --strict

  getting_started:
    name: getting started (GitHub Action on the example)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      # The local copy of the action (the root one, as listed on the Marketplace);
      # it installs qasight from PyPI, so this checks the guide against the
      # published release.
      - id: qasight
        uses: ./
        with:
          config-path: examples/getting-started/qasight.yaml
          cycle: unit
          python-version: "3.11"
      - name: Check the action's outputs
        run: test "${{ steps.qasight.outputs.status }}" = success

  github_action:
    name: github action (this checkout, PR comment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      # Two runs, so the second summary has a previous run to compare with.
      - uses: ./integrations/github-action
        with:
          package: .
          config-path: examples/getting-started/qasight.yaml
          cycle: unit
          job-summary: "false"
      - id: qasight
        uses: ./integrations/github-action
        with:
          package: .
          config-path: examples/getting-started/qasight.yaml
          cycle: unit
          comment-on-pr: "true"
      - name: Check the action's outputs
        run: test "${{ steps.qasight.outputs.status }}" = success
      # Recording results instead of running a cycle (what a repo with no
      # qasight.yaml gets): the tests write JUnit XML, the action ingests it.
      - run: python -m pytest -q --junitxml=test-results/example.xml
        working-directory: examples/getting-started
      - id: ingest
        uses: ./integrations/github-action
        with:
          package: .
          results: examples/getting-started/test-results/example.xml
          cycle: example-ingest
          comment-on-pr: "false"
      - name: Check the ingest run's outputs
        run: test "${{ steps.ingest.outputs.status }}" = success

  team_server:
    name: team server (image + compose + qasight ingest --server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - run: bash scripts/team_server_smoke.sh

  helm_chart:
    name: helm chart (lint + template)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # helm is on GitHub's Ubuntu runners.
      - run: helm lint deploy/helm/qasight --set auth.token=ci-token
      - run: |
          helm template ci deploy/helm/qasight --set auth.token=ci-token > /tmp/default.yaml
          helm template ci deploy/helm/qasight --set auth.existingSecret=qasight \
            --set auth.mode=accounts --set auth.oidc.issuer=https://idp.example.com \
            --set auth.oidc.clientId=qasight --set ingress.enabled=true \
            --set persistence.enabled=false --set env.TESTO_RETENTION_DAYS=90 > /tmp/sso.yaml
          grep -q "kind: Deployment" /tmp/default.yaml
          grep -q "TESTO_OIDC_ISSUER" /tmp/sso.yaml
          ! helm template ci deploy/helm/qasight 2>/dev/null

  package:
    name: package (build + clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Bundle the web UI
        run: bash scripts/build_ui_bundle.sh
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check distribution metadata
        run: twine check --strict dist/*
      - name: Install the wheel with no extras and run a cycle
        run: bash scripts/package_smoke.sh dist

  deploy:
    name: deploy (build wheel)
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
      # Publishing is not done here: publish.yml (PyPI, trusted publishing),
      # docker-publish.yml (GHCR images) and move-major-tag.yml run on the
      # same release event.
