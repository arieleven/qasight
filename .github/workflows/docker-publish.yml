name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish the image for, e.g. v1.1.1. Builds the selected branch, which must carry that version"
        required: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CI runner image (`qasight run` in a container).
          - image: qasight-runner
            dockerfile: Dockerfile.qasight-runner
            verify: qasight-runner:scan run --help
          # The team server: API + web UI (deploy/server/docker-compose.yml).
          - image: qasight-server
            dockerfile: Dockerfile.qasight-server
            # The API and its routes import, and the built UI is in place.
            verify: >-
              --entrypoint python qasight-server:scan -c
              "import qasight_api.main, pathlib; assert pathlib.Path('/app/ui/index.html').is_file()"
          # Starts each stage in a throwaway container (deploy/server/docker-compose.runner.yml).
          - image: qasight-runner-service
            dockerfile: Dockerfile.qasight-runner-service
            # The service file loads and the docker client is in place.
            verify: >-
              --entrypoint python qasight-runner-service:scan -c
              "import runpy, shutil; runpy.run_path('/app/runner_service.py'); assert shutil.which('docker')"
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the package version
        run: |
          pkg="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$pkg" != "${TAG#v}" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $pkg"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Scan Dockerfile with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.dockerfile }}
          exit-code: 1
          severity: CRITICAL,HIGH

      # Build and check the amd64 image locally first, so an image that fails
      # the scan or doesn't start is never pushed.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          tags: ${{ matrix.image }}:scan
          build-args: |
            TESTO_VERSION=${{ env.TAG }}
            TESTO_COMMIT_SHA=${{ github.sha }}
            TESTO_CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Verify image
        run: docker run --rm ${{ matrix.verify }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TESTO_VERSION=${{ env.TAG }}
            TESTO_COMMIT_SHA=${{ github.sha }}
            TESTO_CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
