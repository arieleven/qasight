name: uploader

# qasight-upload (uploader/, Go): the one-file uploader for CI jobs without Python.
# See docs/Processes & Guides/Upload Without Python.md.
#
#   test     gofmt, go vet, go test -race, and a build for every release platform
#   smoke    uploads with the built binary to a real `qasight-api` from this checkout
#            (scripts/upload_binary_smoke.sh), so an ingest API change that breaks
#            the uploader fails here
#   release  on a published release: static binaries for Linux, macOS and Windows
#            (amd64 and arm64), a SHA256SUMS file and a signed build provenance
#            attestation, attached to the release

on:
  pull_request:
    paths:
      - uploader/**
      - scripts/upload_binary_smoke.sh
      - qasight_api/routes/ingest.py
      - qasight_api/models.py
      - qasight/services/junit_ingest.py
      - .github/workflows/uploader.yml
  push:
    branches: [main]
    paths:
      - uploader/**
      - scripts/upload_binary_smoke.sh
      - qasight_api/routes/ingest.py
      - qasight_api/models.py
      - qasight/services/junit_ingest.py
      - .github/workflows/uploader.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the binaries to (e.g. v1.7.0)"
        required: true

concurrency:
  group: uploader-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: uploader (go test)
    if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: uploader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: uploader/go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build for every release platform
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null .
          done

  smoke:
    name: uploader (against a real server)
    if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: uploader/go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[api]"
      - run: scripts/upload_binary_smoke.sh

  release:
    name: uploader binaries on the release
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release upload
      id-token: write # signs the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: uploader/go.mod
          cache: false
      - name: Build
        working-directory: uploader
        run: |
          version="${TAG#v}"
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "../dist/qasight-upload-$os-$arch$ext" .
          done
          cd ../dist && sha256sum qasight-upload-* > qasight-upload-SHA256SUMS
          cat qasight-upload-SHA256SUMS
      - name: Check the Linux binary runs
        run: dist/qasight-upload-linux-amd64 --version
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/qasight-upload-*
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/qasight-upload-* --clobber
