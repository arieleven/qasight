name: release-gate

on:
  workflow_dispatch:

concurrency:
  group: external-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  external_release_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTO_E2E_EXTERNAL_DRY_RUN: "false"
      TESTO_E2E_GITHUB_TOKEN: ${{ secrets.TESTO_E2E_GITHUB_TOKEN }}
      TESTO_E2E_GITHUB_OWNER: ${{ secrets.TESTO_E2E_GITHUB_OWNER }}
      TESTO_E2E_GITLAB_TOKEN: ${{ secrets.TESTO_E2E_GITLAB_TOKEN }}
      TESTO_E2E_GITLAB_GROUP_ID: ${{ secrets.TESTO_E2E_GITLAB_GROUP_ID }}
      TESTO_E2E_GITLAB_BASE_URL: ${{ secrets.TESTO_E2E_GITLAB_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # --no-cov: a marker subset can't meet pytest.ini's project-wide gate.
      - name: Run release external gate
        run: python -m pytest -q -m "tier_external and cleanup_required" --maxfail=1 --durations=50 --no-cov
      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-artifacts
          path: |
            .artifacts/e2e/**
            **/*.log
            **/*summary*.json
            **/*api*.json
            **/*.png

