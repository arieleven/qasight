[build-system]
requires = ["hatchling>=1.27.0", "hatch-fancy-pypi-readme>=25.1.0"]
build-backend = "hatchling.build"

[project]
name = "qasight"
version = "1.6.0"
description = "Run and track your tests, compare and export results, and catch the flaky ones. Get deeper insight with AI, using your own model."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taltal", email = "ttlgptinc@gmail.com" }]
keywords = [
    "testing",
    "flaky-tests",
    "test-history",
    "test-analytics",
    "test-orchestration",
    "pytest",
    "behave",
    "bdd",
    "allure",
    "junit",
    "ci",
    "test-reporting",
    "playwright",
    "jest",
    "github-actions",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Lean runtime: only what `qasight run` and `qasight report` strictly need.
# Run history is always saved (SQLite by default), so sqlmodel is core; database
# drivers other than SQLite, the API and metrics live in extras groups below.
dependencies = [
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.24",
    "alembic>=1.13.0",
    "requests>=2.34.2",
    "allure-pytest>=2.15.0",
    "allure-python-commons>=2.16.2",
    "PyYAML>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "watchdog>=4.0.0",
    "Jinja2>=3.1.0",
    # Uploaded JUnit, TRX and Robot XML is parsed without entity expansion or DTD fetches.
    "defusedxml>=0.7.1",
]

[project.scripts]
qasight = "qasight.cli.app:main"
qasight-api = "qasight_api.main:run"
qasight-runner-service = "qasight.engine.backends.runner_service:main"
# The names from before the rename to QASight (1.6), kept so scripts and CI keep working.
testo = "qasight.cli.app:main"
testo-api = "qasight_api.main:run"
testo-runner-service = "qasight.engine.backends.runner_service:main"

# `pytest --qasight` records the session as a run; inert without the flag.
[project.entry-points.pytest11]
qasight = "qasight.pytest_plugin"

[project.optional-dependencies]
# Behave and BehaveX stages (`equipment: behave` / `behavex`) and their Allure formatter.
# Optional since 1.2: pytest, Playwright, `command` and `qasight ingest` don't need them.
bdd = [
    "behave>=1.3.3,<2",
    "behavex>=4.6.0",
    "allure-behave>=2.15.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # [crypto]: RS256 and ES256 ID tokens for single sign-on (qasight_api/oidc.py).
    "pyjwt[crypto]>=2.9.0",
    # `qasight export-site` calls the API in-process through starlette's TestClient.
    "httpx>=0.27.0",
]
db = [
    "psycopg[binary]>=3.2.0",
    "tomli-w>=1.0.0",
]
db_mysql = [
    "pymysql>=1.1.0",
]
metrics = [
    "matplotlib>=3.10.0",
    "influxdb-client>=1.48.0",
]
# `otel` reporter and `qasight otel`: runs as OpenTelemetry traces over OTLP/HTTP.
# For OTLP/gRPC also install opentelemetry-exporter-otlp-proto-grpc.
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
# `qasight export` and the Report page's downloads: PDF and PNG are drawn by headless
# Chromium (run `playwright install chromium` once, or set TESTO_CHROMIUM to a Chrome),
# PowerPoint by python-pptx, Excel by openpyxl. HTML, CSV and JSON need none of them.
export = [
    "playwright>=1.48.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
]
# `qasight mcp`: the run history as an MCP server for coding agents (stdio).
# Works with the SDK's 1.x FastMCP and 2.x MCPServer. Not in `dev`: mcp 2.x pulls in
# httpx2, which starlette's TestClient then uses instead of httpx for every API test.
mcp = [
    "mcp>=1.23.0",
]
# The docs site (mkdocs.yml). Material 9.x pins MkDocs below 2.0.
docs = [
    "mkdocs-material>=9.7.7,<10",
]
dev = [
    "import-linter>=2.0",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
    "build>=1.2.0",
    # One ruff for CI and the pre-commit hook (tests/contract/ci/test_ruff_pin.py
    # checks .pre-commit-config.yaml matches); bump both together.
    "ruff==0.17.3",
    "mypy>=2.1.0",
    "pre-commit>=4.0.0",
    # The dev profile installs every extra so the test suite covers the full
    # surface area without needing per-test installs.
    "qasight[api,bdd,db,metrics,otel,export]",
]

[project.urls]
Homepage = "https://github.com/arieleven/qasight"
Documentation = "https://arieleven.github.io/qasight/docs/"
Demo = "https://arieleven.github.io/qasight/"
Source = "https://github.com/arieleven/qasight"
Issues = "https://github.com/arieleven/qasight/issues"
Changelog = "https://github.com/arieleven/qasight/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/arieleven/qasight/releases"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI renders the README without the repository around it, so relative image
# and link targets would break there. Images go to raw GitHub URLs first; the
# last rule then points every remaining relative link at the file on GitHub.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/arieleven/qasight/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/arieleven/qasight/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/arieleven/qasight/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)\s]+)\)'
replacement = '](https://github.com/arieleven/qasight/blob/main/\1)'

# The sdist carries what is needed to build and test the Python package; the
# frontend, docs vault and CI wrappers stay in the repository.
[tool.hatch.build.targets.sdist]
include = [
    "/qasight",
    "/qasight_api",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pytest.ini",
]
# The built UI is gitignored, so it has to be named to reach the sdist (and the
# wheel built from it). Present only after scripts/build_ui_bundle.sh.
artifacts = ["/qasight_api/ui_dist"]

[tool.hatch.build.targets.wheel]
packages = ["qasight", "qasight_api"]
artifacts = ["qasight_api/ui_dist"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Started as pyflakes (F) + a subset of pycodestyle (E) + import sorting (I);
# extended with pyupgrade (UP) and bugbear (B). Line-length (E501) is ignored:
# `ruff format` (blocking in CI) wraps code, and the lines it leaves long are
# strings and comments it deliberately does not split.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # Typer/FastAPI both use `Depends(...)`/`typer.Option(...)` as default-arg values —
    # the idiomatic pattern for both frameworks, used throughout qasight_api and the CLI.
    "B008",
    # `class Foo(str, Enum)` -> `enum.StrEnum` is a real behavior-adjacent change
    # (repr/serialization edge cases) affecting enums used pervasively (RunStatus,
    # EngineExitCode); deserves its own tested PR, not a lint-config side effect.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# Layer check (`lint-imports`, run in the CI `format` job): the layer table in
# ARCHITECTURE.md as contracts. Each ignore_imports is a known, documented exception.
[tool.importlinter]
root_packages = ["qasight", "qasight_api"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "qasight does not import qasight_api (the CLI's `qasight ui` and `qasight export-site` load it lazily)"
type = "forbidden"
source_modules = ["qasight"]
forbidden_modules = ["qasight_api"]
ignore_imports = [
    "qasight.cli.commands.ui_cmd -> qasight_api.*",
    "qasight.cli.commands.export_site -> qasight_api.*",
]

[[tool.importlinter.contracts]]
name = "qasight_api does not import the CLI"
type = "forbidden"
source_modules = ["qasight_api"]
forbidden_modules = ["qasight.cli"]

[[tool.importlinter.contracts]]
name = "nothing below the analytics imports services or cli (db_backend's stdlib-only CI provenance, run environment and release lookups are the exceptions)"
type = "forbidden"
source_modules = [
    "qasight.paths",
    "qasight.config",
    "qasight.frameworks",
    "qasight.engine",
    "qasight.persistence",
    "qasight.repository",
    "qasight.history",
    "qasight.resources",
]
forbidden_modules = ["qasight.services", "qasight.cli"]
ignore_imports = [
    "qasight.persistence.db_backend -> qasight.services.ci_provenance",
    "qasight.persistence.db_backend -> qasight.services.run_environment",
    "qasight.persistence.db_backend -> qasight.services.run_release",
]

[[tool.importlinter.contracts]]
name = "repository is the bottom: it imports only config (database.url) and paths"
type = "forbidden"
source_modules = ["qasight.repository"]
forbidden_modules = [
    "qasight.engine",
    "qasight.frameworks",
    "qasight.reporting",
    "qasight.persistence",
    "qasight.history",
    "qasight.services",
    "qasight.cli",
    "qasight.resources",
]

[[tool.importlinter.contracts]]
name = "paths, config and frameworks sit under engine, persistence, history and reporting (the plugin loader's reporter base class is the one exception)"
type = "forbidden"
source_modules = ["qasight.paths", "qasight.config", "qasight.frameworks"]
forbidden_modules = [
    "qasight.engine",
    "qasight.persistence",
    "qasight.history",
    "qasight.reporting",
]
ignore_imports = ["qasight.plugins -> qasight.reporting.reporters.base"]

[[tool.importlinter.contracts]]
name = "persistence (write side) and history (read side) do not import each other"
type = "independence"
modules = ["qasight.persistence", "qasight.history"]

# Mutation testing (release-gate.yml): mutants of the flaky, attention and
# retention logic must be caught by their unit tests. Run with the package
# NOT installed (an installed copy would shadow the mutants).
[tool.mutmut]
paths_to_mutate = [
    "qasight/history/retention.py",
    "qasight/services/attention.py",
    "qasight/services/flaky_service.py",
]
tests_dir = [
    "tests/unit/qasight/history/test_retention.py",
    "tests/unit/qasight/test_attention.py",
    "tests/unit/qasight/test_flaky_service.py",
    "tests/unit/qasight/test_flaky_scoring.py",
]
also_copy = [
    "qasight",
    "qasight_api",
    "pytest.ini",
    "tests",
    "qasight.yaml",
    "sample_target_repo",
    "schema",
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "--no-cov"]
