[build-system]
requires = ["hatchling>=1.27.0", "hatch-fancy-pypi-readme>=25.1.0"]
build-backend = "hatchling.build"

[project]
name = "testo-core"
version = "1.5.0"
description = "See what broke, what's flaky and what got slower on every run: test history, run-to-run diffs and flaky detection for pytest, Playwright, Jest or any JUnit-writing runner."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taltal", email = "ttlgptinc@gmail.com" }]
keywords = [
    "testing",
    "flaky-tests",
    "test-history",
    "test-analytics",
    "test-orchestration",
    "pytest",
    "behave",
    "bdd",
    "allure",
    "junit",
    "ci",
    "test-reporting",
    "playwright",
    "jest",
    "github-actions",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Lean runtime: only what `testo run` and `testo report` strictly need.
# Run history is always saved (SQLite by default), so sqlmodel is core; database
# drivers other than SQLite, the API and metrics live in extras groups below.
dependencies = [
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.24",
    "alembic>=1.13.0",
    "requests>=2.34.2",
    "allure-pytest>=2.15.0",
    "allure-python-commons>=2.16.2",
    "PyYAML>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "watchdog>=4.0.0",
    "Jinja2>=3.1.0",
]

[project.scripts]
testo = "testo_core.cli.app:main"
testo-api = "testo_api.main:run"
testo-runner-service = "testo_core.engine.backends.runner_service:main"

# `pytest --testo` records the session as a run; inert without the flag.
[project.entry-points.pytest11]
testo = "testo_core.pytest_plugin"

[project.optional-dependencies]
# Behave and BehaveX stages (`equipment: behave` / `behavex`) and their Allure formatter.
# Optional since 1.2: pytest, Playwright, `command` and `testo ingest` don't need them.
bdd = [
    "behave>=1.3.3,<2",
    "behavex>=4.6.0",
    "allure-behave>=2.15.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9.0",
]
db = [
    "psycopg[binary]>=3.2.0",
    "tomli-w>=1.0.0",
]
db_mysql = [
    "pymysql>=1.1.0",
]
metrics = [
    "matplotlib>=3.10.0",
    "influxdb-client>=1.48.0",
]
# `otel` reporter and `testo otel`: runs as OpenTelemetry traces over OTLP/HTTP.
# For OTLP/gRPC also install opentelemetry-exporter-otlp-proto-grpc.
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
# `testo export` and the Report page's downloads: PDF and PNG are drawn by headless
# Chromium (run `playwright install chromium` once, or set TESTO_CHROMIUM to a Chrome),
# PowerPoint by python-pptx, Excel by openpyxl. HTML, CSV and JSON need none of them.
export = [
    "playwright>=1.48.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
]
# `testo mcp`: the run history as an MCP server for coding agents (stdio).
# Works with the SDK's 1.x FastMCP and 2.x MCPServer. Not in `dev`: mcp 2.x pulls in
# httpx2, which starlette's TestClient then uses instead of httpx for every API test.
mcp = [
    "mcp>=1.23.0",
]
# The docs site (mkdocs.yml). Material 9.x pins MkDocs below 2.0.
docs = [
    "mkdocs-material>=9.7.7,<10",
]
dev = [
    "import-linter>=2.0",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
    "build>=1.2.0",
    # One ruff for CI and the pre-commit hook (tests/contract/ci/test_ruff_pin.py
    # checks .pre-commit-config.yaml matches); bump both together.
    "ruff==0.17.3",
    "mypy>=2.1.0",
    "pre-commit>=4.0.0",
    # The dev profile installs every extra so the test suite covers the full
    # surface area without needing per-test installs.
    "testo-core[api,bdd,db,metrics,otel,export]",
]

[project.urls]
Homepage = "https://github.com/taltal-beep/testosterone"
Documentation = "https://taltal-beep.github.io/testosterone/docs/"
Demo = "https://taltal-beep.github.io/testosterone/"
Source = "https://github.com/taltal-beep/testosterone"
Issues = "https://github.com/taltal-beep/testosterone/issues"
Changelog = "https://github.com/taltal-beep/testosterone/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/taltal-beep/testosterone/releases"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI renders the README without the repository around it, so relative image
# and link targets would break there. Images go to raw GitHub URLs first; the
# last rule then points every remaining relative link at the file on GitHub.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/taltal-beep/testosterone/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/taltal-beep/testosterone/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/taltal-beep/testosterone/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)\s]+)\)'
replacement = '](https://github.com/taltal-beep/testosterone/blob/main/\1)'

# The sdist carries what is needed to build and test the Python package; the
# frontend, docs vault and CI wrappers stay in the repository.
[tool.hatch.build.targets.sdist]
include = [
    "/testo_core",
    "/testo_api",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pytest.ini",
]
# The built UI is gitignored, so it has to be named to reach the sdist (and the
# wheel built from it). Present only after scripts/build_ui_bundle.sh.
artifacts = ["/testo_api/ui_dist"]

[tool.hatch.build.targets.wheel]
packages = ["testo_core", "testo_api"]
artifacts = ["testo_api/ui_dist"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Started as pyflakes (F) + a subset of pycodestyle (E) + import sorting (I);
# extended with pyupgrade (UP) and bugbear (B). Line-length (E501) is ignored:
# `ruff format` (blocking in CI) wraps code, and the lines it leaves long are
# strings and comments it deliberately does not split.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # Typer/FastAPI both use `Depends(...)`/`typer.Option(...)` as default-arg values —
    # the idiomatic pattern for both frameworks, used throughout testo_api and the CLI.
    "B008",
    # `class Foo(str, Enum)` -> `enum.StrEnum` is a real behavior-adjacent change
    # (repr/serialization edge cases) affecting enums used pervasively (RunStatus,
    # EngineExitCode); deserves its own tested PR, not a lint-config side effect.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# Layer check (`lint-imports`, run in the CI `format` job): the layer table in
# ARCHITECTURE.md as contracts. Each ignore_imports is a known, documented exception.
[tool.importlinter]
root_packages = ["testo_core", "testo_api"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "testo_core does not import testo_api (the CLI's `testo ui` starts the server lazily)"
type = "forbidden"
source_modules = ["testo_core"]
forbidden_modules = ["testo_api"]
ignore_imports = ["testo_core.cli.commands.ui_cmd -> testo_api.*"]

[[tool.importlinter.contracts]]
name = "testo_api does not import the CLI"
type = "forbidden"
source_modules = ["testo_api"]
forbidden_modules = ["testo_core.cli"]

[[tool.importlinter.contracts]]
name = "nothing below the analytics imports services or cli (db_backend's CI provenance lookup is the one exception)"
type = "forbidden"
source_modules = [
    "testo_core.paths",
    "testo_core.config",
    "testo_core.frameworks",
    "testo_core.engine",
    "testo_core.persistence",
    "testo_core.repository",
    "testo_core.history",
    "testo_core.resources",
]
forbidden_modules = ["testo_core.services", "testo_core.cli"]
ignore_imports = ["testo_core.persistence.db_backend -> testo_core.services.ci_provenance"]

[[tool.importlinter.contracts]]
name = "repository is the bottom: it imports only config (database.url) and paths"
type = "forbidden"
source_modules = ["testo_core.repository"]
forbidden_modules = [
    "testo_core.engine",
    "testo_core.frameworks",
    "testo_core.reporting",
    "testo_core.persistence",
    "testo_core.history",
    "testo_core.services",
    "testo_core.cli",
    "testo_core.resources",
]

[[tool.importlinter.contracts]]
name = "paths, config and frameworks sit under engine, persistence, history and reporting (the plugin loader's reporter base class is the one exception)"
type = "forbidden"
source_modules = ["testo_core.paths", "testo_core.config", "testo_core.frameworks"]
forbidden_modules = [
    "testo_core.engine",
    "testo_core.persistence",
    "testo_core.history",
    "testo_core.reporting",
]
ignore_imports = ["testo_core.plugins -> testo_core.reporting.reporters.base"]

[[tool.importlinter.contracts]]
name = "persistence (write side) and history (read side) do not import each other"
type = "independence"
modules = ["testo_core.persistence", "testo_core.history"]
