# A complete QASight plugin: one framework adapter and one reporter.
# pip install -e examples/plugin, then `qasight plugins --check`.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qasight-example-plugin"
version = "0.1.0"
description = "Example QASight plugin: a unittest runner and a JSON summary reporter."
requires-python = ">=3.11"
dependencies = ["qasight"]

[project.entry-points."qasight.frameworks"]
unittest = "qasight_example_plugin:UnittestAdapter"

[project.entry-points."qasight.reporters"]
json-summary = "qasight_example_plugin:JsonSummaryReporter"

[tool.setuptools]
packages = ["qasight_example_plugin"]
