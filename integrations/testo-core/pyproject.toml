[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

# testo-core was renamed to qasight in 1.6. This package is released with every
# qasight version (same number) so `pip install -U testo-core` keeps upgrading:
# it installs qasight and keeps `import testo_core` / `import testo_api` working.
# tests/contract/ci/test_testo_core_compat.py keeps its version and extras in step.
[project]
name = "testo-core"
version = "1.7.0"
description = "testo-core is now qasight: this package installs qasight and keeps the old testo_core imports working."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Taltal" }]
dependencies = ["qasight==1.7.0"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]

# Also declared by qasight. Upgrading from testo-core 1.5 removes the old package's
# copies of these after qasight wrote its own, so this package writes them again.
[project.scripts]
testo = "qasight.cli.app:main"
testo-api = "qasight_api.main:run"
testo-runner-service = "qasight.engine.backends.runner_service:main"

[project.optional-dependencies]
bdd = ["qasight[bdd]==1.7.0"]
api = ["qasight[api]==1.7.0"]
db = ["qasight[db]==1.7.0"]
db_mysql = ["qasight[db_mysql]==1.7.0"]
metrics = ["qasight[metrics]==1.7.0"]
otel = ["qasight[otel]==1.7.0"]
export = ["qasight[export]==1.7.0"]
mcp = ["qasight[mcp]==1.7.0"]
docs = ["qasight[docs]==1.7.0"]
dev = ["qasight[dev]==1.7.0"]

[project.urls]
Homepage = "https://pypi.org/project/qasight/"

[tool.hatch.build.targets.wheel]
packages = ["testo_core", "testo_api"]
