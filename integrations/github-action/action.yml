# Generated from the root action.yml by scripts/sync_action_copy.py; edit that file.
# This path (.../integrations/github-action@v1) is kept working for older workflows.
name: QASight Test History
description: Run your tests or read JUnit XML, keep their history, and show what broke, what's flaky and what got slower.
branding:
  icon: activity
  color: blue
inputs:
  results:
    description: "Result files to record instead of running a cycle (globs, space or newline separated). Empty with no qasight.yaml in the workspace = find them (JUnit XML, Jest/Vitest/Playwright JSON, .trx, go test -json, ...)."
    required: false
    default: ""
  history:
    description: "`auto` keeps the run history (SQLite) in the Actions cache between runs unless DATABASE_URL or database.url is set; `off` doesn't."
    required: false
    default: auto
  history-artifact:
    description: "With the cached history: also upload it (the SQLite file) as a `testo-history-...` artifact kept 7 days, so `qasight ui --from-github` can open the CI history on your machine. `false` skips the upload."
    required: false
    default: "true"
  static-site:
    description: "`true`: after the run, write the history as a read-only site (`qasight export-site`) and upload it with actions/upload-pages-artifact, for an `actions/deploy-pages` job to publish. Needs the UI a released qasight ships."
    required: false
    default: "false"
  static-site-base-path:
    description: Path the site is served under (empty = GitHub Pages' path for this repository, `/<repo>/`, or `/` for `<owner>.github.io`; set `/` for a custom domain).
    required: false
    default: ""
  config-path:
    description: Path to qasight.yaml (empty = discovery from the workspace root).
    required: false
    default: ""
  cycle:
    description: Cycle to run (empty = the only cycle in the config; `all` = every cycle, each with its own summary, comment and alert).
    required: false
    default: ""
  ci-mode:
    description: Emit NDJSON events on stdout (`qasight run --ci`).
    required: false
    default: "true"
  persist:
    description: Persist plan_result.json and the run history record.
    required: false
    default: "true"
  python-version:
    description: Python version used to run testo.
    required: false
    default: "3.11"
  package:
    description: What to pip install for qasight, e.g. `qasight==1.2.0`, `.` for a checkout of this repository, or several requirements separated by spaces (`qasight pytest-xdist`).
    required: false
    default: qasight
  job-summary:
    description: Write the run (results, failing tests, changes since the last run) to the job summary.
    required: false
    default: "true"
  comment-on-pr:
    description: "On pull_request events, keep one comment per cycle on the pull request with the same summary. Needs `permissions: pull-requests: write`. `auto` = on when there is no qasight.yaml (recording results), off when running a cycle."
    required: false
    default: auto
  annotations:
    description: Print failing tests as annotations, shown inline on the pull request diff. Needs no permission.
    required: false
    default: "true"
  slack-webhook:
    description: "Slack incoming-webhook URL. Pass a repository secret (secrets.SLACK_WEBHOOK_URL); empty = no Slack alert."
    required: false
    default: ""
  teams-webhook:
    description: "Microsoft Teams Workflows webhook URL. Pass a secret; empty = no Teams alert."
    required: false
    default: ""
  notify-when:
    description: "When to send the chat alert: `failure` (red run or newly flaky test), `change` (differs from the previous run) or `always`."
    required: false
    default: failure
  flaky-issues:
    description: "Open one issue per test that this run made flaky (skipped if an open issue has the same title). Needs `permissions: issues: write`."
    required: false
    default: "false"
  coverage:
    description: "Code coverage report(s) the tests write (Cobertura or JaCoCo XML, LCOV, Go cover profile), space-separated. Stored with the run; the summary and PR comment show line coverage and its change."
    required: false
    default: ""
  environment:
    description: "What this job tests on, as KEY=VALUE pairs separated by commas (for a matrix, browser=firefox, os=linux from the matrix values). Flaky detection and the test page keep environments apart. Default: the TESTO_ENV variable."
    required: false
    default: ""
  release:
    description: "The release this job tests (2.3, or the tag from github.ref_name); the Releases page groups runs by it. Default: the TESTO_RELEASE variable."
    required: false
    default: ""
  ai-summary:
    description: "Add an AI summary of the failures to the job summary and comment of a failed run. Set the provider in the step's env: TESTO_AI_PROVIDER (openai, anthropic, openai_compatible), TESTO_AI_MODEL, TESTO_AI_BASE_URL and its key from a secret (OPENAI_API_KEY, ANTHROPIC_API_KEY, or TESTO_AI_KEY_ENV naming another variable)."
    required: false
    default: "false"
  comment-artifact:
    description: "Fork-safe comments: on pull_request events, upload the comment as a `testo-comment` artifact instead of posting it, for a `workflow_run` workflow that runs this action with `post-comments-from` (a fork's pull request gets a read-only token). `qasight init --forks` writes both workflows."
    required: false
    default: "false"
  post-comments-from:
    description: "Only post the comments a `comment-artifact` run left in this folder (download the `testo-comment` artifact there first), on the pull request whose head is the triggering run's commit. Runs nothing else. For `workflow_run` workflows."
    required: false
    default: ""
  server-url:
    description: "Also upload each recorded run to this QASight team server (e.g. https://qasight.example.com), as `qasight ingest --server` does. The job summary and comment still come from the Actions-cache history."
    required: false
    default: ""
  server-token:
    description: "The team server's API token. Pass a secret (secrets.TESTO_API_TOKEN)."
    required: false
    default: ""
  scorecard:
    description: "Score the repository with `qasight scorecard scan` (MegaLinter in Docker, OSV-Scanner and the other tools that fit): `true` after the tests, `only` instead of them, `false` (default) not at all. Writes the scorecard to the job summary and one pull request comment, and SARIF (`scorecard_sarif` output, for github/codeql-action/upload-sarif), an HTML page and a badge. The history cache keeps earlier scores, so the summary compares with the last one."
    required: false
    default: "false"
  scorecard-path:
    description: Folder or git URL to score (default the workspace).
    required: false
    default: "."
  scorecard-min-score:
    description: Fail the step when the overall score is below this (0-100). Empty = no threshold.
    required: false
    default: ""
  scorecard-no-new:
    description: "`true`: fail the step when a tool has findings the last scored version didn't have (new code only, like SonarQube's quality gate)."
    required: false
    default: "false"
  scorecard-tools:
    description: Run only these scorecard tools (comma-separated ids from `qasight scorecard tools`). Empty = every switched-on tool that fits.
    required: false
    default: ""
  setup:
    description: "`true` sets QASight up in this repository instead of recording a run: it finds the test runners (`qasight init --scan --attach`), then pushes a `qasight-setup` branch and opens a pull request with the config and the workflow change. Needs `contents: write` and `pull-requests: write`; Getting Started has the one-time workflow that does this."
    required: false
    default: "false"
  github-token:
    description: Token used for the pull request comment and flaky test issues.
    required: false
    default: ${{ github.token }}
outputs:
  exit_code:
    description: qasight process exit code.
    value: ${{ steps.run_testo.outputs.exit_code }}
  summary_json:
    description: Final `plan_finished` (or `error`) NDJSON event as a JSON string.
    value: ${{ steps.run_testo.outputs.summary_json }}
  summary_path:
    description: Absolute path to the saved summary JSON file.
    value: ${{ steps.run_testo.outputs.summary_path }}
  status:
    description: Normalized status string from exit code.
    value: ${{ steps.run_testo.outputs.status }}
  site_dir:
    description: With `static-site`, the folder the read-only site was written to (empty if it wasn't).
    value: ${{ steps.site.outputs.site_dir }}
  scorecard_dir:
    description: With `scorecard`, the folder with scorecard.md, scorecard.sarif, scorecard.html and badge.svg.
    value: ${{ steps.scorecard.outputs.scorecard_dir }}
  scorecard_sarif:
    description: With `scorecard`, the SARIF file for github/codeql-action/upload-sarif.
    value: ${{ steps.scorecard.outputs.scorecard_sarif }}
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install qasight
      if: inputs.post-comments-from == ''
      shell: bash
      env:
        # Inputs reach the shell as variables, never pasted into the script,
        # so a quote or $(...) in an input is data, not a command.
        TESTO_INPUT_PACKAGE: ${{ inputs.package }}
      run: |
        python -m pip install --upgrade pip
        # One or more requirements, space separated: "qasight pytest-xdist".
        read -r -a packages <<< "$TESTO_INPUT_PACKAGE"
        python -m pip install "${packages[@]}"
    - name: Prepare run history
      id: history
      if: inputs.post-comments-from == '' && inputs.setup != 'true'
      shell: bash
      env:
        TESTO_INPUT_HISTORY: ${{ inputs.history }}
        TESTO_INPUT_CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        python "$GITHUB_ACTION_PATH/run_testo_action.py" prepare-history \
          --history "$TESTO_INPUT_HISTORY" \
          --config-path "$TESTO_INPUT_CONFIG_PATH"
    - name: Restore run history
      id: restore
      if: steps.history.outputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.history.outputs.dir }}
        key: ${{ steps.history.outputs.key }}
        restore-keys: ${{ steps.history.outputs.restore_prefix }}
    - name: Run qasight
      id: run_testo
      if: inputs.post-comments-from == '' && inputs.scorecard != 'only' && inputs.setup != 'true'
      shell: bash
      env:
        DATABASE_URL: ${{ steps.history.outputs.database_url }}
        TESTO_INPUT_RESULTS: ${{ inputs.results }}
        TESTO_GITHUB_TOKEN: ${{ inputs.github-token }}
        TESTO_SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook }}
        TESTO_TEAMS_WEBHOOK_URL: ${{ inputs.teams-webhook }}
        TESTO_INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        TESTO_INPUT_CYCLE: ${{ inputs.cycle }}
        TESTO_INPUT_CI_MODE: ${{ inputs.ci-mode }}
        TESTO_INPUT_PERSIST: ${{ inputs.persist }}
        TESTO_INPUT_JOB_SUMMARY: ${{ inputs.job-summary }}
        TESTO_INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        TESTO_INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        TESTO_INPUT_NOTIFY_WHEN: ${{ inputs.notify-when }}
        TESTO_INPUT_FLAKY_ISSUES: ${{ inputs.flaky-issues }}
        TESTO_INPUT_COVERAGE: ${{ inputs.coverage }}
        TESTO_ENV: ${{ inputs.environment || env.TESTO_ENV }}
        TESTO_RELEASE: ${{ inputs.release || env.TESTO_RELEASE }}
        TESTO_INPUT_AI_SUMMARY: ${{ inputs.ai-summary }}
        TESTO_INPUT_COMMENT_ARTIFACT: ${{ inputs.comment-artifact }}
        TESTO_INPUT_SERVER_URL: ${{ inputs.server-url }}
        TESTO_INPUT_SERVER_TOKEN: ${{ inputs.server-token }}
        TESTO_HISTORY_CACHED: ${{ steps.history.outputs.cache }}
        TESTO_HISTORY_RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        python "$GITHUB_ACTION_PATH/run_testo_action.py" \
          --config-path "$TESTO_INPUT_CONFIG_PATH" \
          --cycle "$TESTO_INPUT_CYCLE" \
          --ci-mode "$TESTO_INPUT_CI_MODE" \
          --persist "$TESTO_INPUT_PERSIST" \
          --job-summary "$TESTO_INPUT_JOB_SUMMARY" \
          --comment-on-pr "$TESTO_INPUT_COMMENT_ON_PR" \
          --annotations "$TESTO_INPUT_ANNOTATIONS" \
          --notify-when "$TESTO_INPUT_NOTIFY_WHEN" \
          --flaky-issues "$TESTO_INPUT_FLAKY_ISSUES" \
          --results "$TESTO_INPUT_RESULTS" \
          --coverage "$TESTO_INPUT_COVERAGE"
    - name: Score the repository
      id: scorecard
      if: inputs.post-comments-from == '' && inputs.setup != 'true' && (inputs.scorecard == 'true' || inputs.scorecard == 'only')
      shell: bash
      env:
        DATABASE_URL: ${{ steps.history.outputs.database_url }}
        TESTO_GITHUB_TOKEN: ${{ inputs.github-token }}
        TESTO_INPUT_SCORECARD_PATH: ${{ inputs.scorecard-path }}
        TESTO_INPUT_SCORECARD_MIN_SCORE: ${{ inputs.scorecard-min-score }}
        TESTO_INPUT_SCORECARD_NO_NEW: ${{ inputs.scorecard-no-new }}
        TESTO_INPUT_SCORECARD_TOOLS: ${{ inputs.scorecard-tools }}
        TESTO_INPUT_JOB_SUMMARY: ${{ inputs.job-summary }}
      run: |
        python "$GITHUB_ACTION_PATH/run_testo_action.py" scorecard \
          --path "$TESTO_INPUT_SCORECARD_PATH" \
          --min-score "$TESTO_INPUT_SCORECARD_MIN_SCORE" \
          --no-new "$TESTO_INPUT_SCORECARD_NO_NEW" \
          --tools "$TESTO_INPUT_SCORECARD_TOOLS" \
          --job-summary "$TESTO_INPUT_JOB_SUMMARY"
    - name: Save run history
      if: always() && steps.history.outputs.cache == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.history.outputs.dir }}
        key: ${{ steps.history.outputs.key }}
    - name: Upload the run history
      # For `qasight ui --from-github`. A name taken twice (a matrix job) must not fail the job.
      if: always() && steps.history.outputs.cache == 'true' && inputs.history-artifact == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.history.outputs.key }}
        path: ${{ steps.history.outputs.dir }}/testo_history.db
        retention-days: 7
        if-no-files-found: ignore
    - name: Export the static site
      id: site
      if: always() && inputs.static-site == 'true' && steps.run_testo.outcome != 'skipped'
      shell: bash
      env:
        DATABASE_URL: ${{ steps.history.outputs.database_url }}
        TESTO_INPUT_STATIC_SITE_BASE_PATH: ${{ inputs.static-site-base-path }}
      run: |
        python "$GITHUB_ACTION_PATH/run_testo_action.py" export-site \
          --out "$RUNNER_TEMP/testo-site" --base-path "$TESTO_INPUT_STATIC_SITE_BASE_PATH"
    - name: Upload the static site for GitHub Pages
      if: always() && steps.site.outputs.site_dir != ''
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ steps.site.outputs.site_dir }}
    - name: Upload the pull request comment
      if: always() && steps.run_testo.outputs.comment_dir != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: testo-comment
        path: ${{ steps.run_testo.outputs.comment_dir }}
        retention-days: 1
    - name: Set up QASight in this repository
      if: inputs.setup == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: python "$GITHUB_ACTION_PATH/run_testo_action.py" setup
    - name: Post comments from a fork's run
      if: inputs.post-comments-from != ''
      shell: bash
      env:
        TESTO_GITHUB_TOKEN: ${{ inputs.github-token }}
        TESTO_INPUT_POST_COMMENTS_FROM: ${{ inputs.post-comments-from }}
      run: |
        python "$GITHUB_ACTION_PATH/run_testo_action.py" post-comments --dir "$TESTO_INPUT_POST_COMMENTS_FROM"
