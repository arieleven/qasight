# QASight team server. Install:
#   helm install qasight deploy/helm/qasight --set auth.token="$(openssl rand -hex 32)"
# Guide: docs/Processes & Guides/Team Server.md#kubernetes

image:
  repository: ghcr.io/arieleven/qasight-server
  # The major version tag follows the newest 1.x release.
  tag: "1"
  pullPolicy: IfNotPresent

auth:
  # TESTO_API_TOKEN: CI uploads with it and admins sign in with it. Required unless
  # existingSecret holds it. Generate one with `openssl rand -hex 32`.
  token: ""
  # Use a Secret you manage instead; it needs the key TESTO_API_TOKEN (and may hold
  # DATABASE_URL, TESTO_OIDC_CLIENT_SECRET or any other TESTO_* setting).
  existingSecret: ""
  # token: everyone shares the token. accounts: per-person sign-in with roles and an audit log.
  mode: token
  # Single sign-on (needs mode: accounts). The client secret goes in the Secret.
  oidc:
    issuer: ""
    clientId: ""
    clientSecret: ""
    allowedDomains: ""
    defaultRole: viewer

database:
  # Postgres URL, e.g. postgresql://user:pass@host:5432/qasight (bare postgres:// works).
  # Empty: SQLite on the data volume (the image works in /data), fine for a small team.
  url: ""

# Any other setting from the Team Server guide, e.g. TESTO_RETENTION_DAYS: "90".
env: {}

persistence:
  # Run artifacts, report snapshots and (without database.url) the SQLite history.
  enabled: true
  size: 10Gi
  storageClass: ""
  existingClaim: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: qasight.example.com
  tls: []
  #  - secretName: qasight-tls
  #    hosts: [qasight.example.com]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
