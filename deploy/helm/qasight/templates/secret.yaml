{{- if not .Values.auth.existingSecret }}
{{- if not .Values.auth.token }}
{{- fail "set auth.token (openssl rand -hex 32) or auth.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qasight.fullname" . }}
  labels:
    {{- include "qasight.labels" . | nindent 4 }}
type: Opaque
stringData:
  TESTO_API_TOKEN: {{ .Values.auth.token | quote }}
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.oidc.clientSecret }}
  TESTO_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
