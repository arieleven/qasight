# Testosterone team server: one place every CI job records into.
#
#   export TESTO_API_TOKEN="$(openssl rand -hex 32)"   # keep it; CI needs it too
#   docker compose up -d                                # from a clone: add --build
#
# Then open http://localhost:8000, sign in with the token and, in each CI job after the tests:
#
#   pip install testo-core
#   testo ingest 'reports/**/*.xml' --cycle web-unit \
#     --server https://testo.example.com --token "$TESTO_API_TOKEN"
#
# Put it behind HTTPS (a reverse proxy) before exposing it beyond your network.
# Guide: docs/Processes & Guides/Team Server.md
services:
  server:
    image: ghcr.io/taltal-beep/testo-server:${TESTO_SERVER_TAG:-1}
    build:
      context: ../..
      dockerfile: Dockerfile.testo-server
    environment:
      # Required: every write (uploads, starting runs, AI settings) needs it.
      TESTO_API_TOKEN: ${TESTO_API_TOKEN:?set TESTO_API_TOKEN (e.g. openssl rand -hex 32)}
      # Reads (runs, logs, reports) need the token too; browsers sign in at /login.
      # Set to 0 only on a network you already trust.
      TESTO_PROTECT_READS: ${TESTO_PROTECT_READS:-1}
      # accounts: people sign in with their own username and password (`testo users add`).
      TESTO_AUTH: ${TESTO_AUTH:-token}
      # With accounts and none yet: this admin is created at start (`testo server init` sets them).
      TESTO_ADMIN_USER: ${TESTO_ADMIN_USER:-}
      TESTO_ADMIN_PASSWORD: ${TESTO_ADMIN_PASSWORD:-}
      # During a token rotation: the old token, still accepted until CI secrets are moved.
      TESTO_API_TOKEN_PREVIOUS: ${TESTO_API_TOKEN_PREVIOUS:-}
      # Signs sign-in cookies instead of the token, so rotating the token keeps people signed in.
      TESTO_SESSION_KEY: ${TESTO_SESSION_KEY:-}
      # Delete runs and report archives older than this many days (empty or 0: keep all).
      TESTO_RETENTION_DAYS: ${TESTO_RETENTION_DAYS:-}
      # Keep at most this many runs per cycle (empty or 0: no limit).
      TESTO_RETENTION_RUNS_PER_CYCLE: ${TESTO_RETENTION_RUNS_PER_CYCLE:-}
      # Files bigger than this many MB aren't kept in a run's history copy (empty: keep all).
      TESTO_HISTORY_MAX_FILE_MB: ${TESTO_HISTORY_MAX_FILE_MB:-}
      # db: runs waiting for a worker are kept in Postgres and survive a restart.
      TESTO_RUN_QUEUE: ${TESTO_RUN_QUEUE:-memory}
      DATABASE_URL: postgresql+psycopg://testo:${POSTGRES_PASSWORD:-testo}@postgres:5432/testo
    ports:
      - "${TESTO_SERVER_PORT:-8000}:8000"
    volumes:
      # Per-run artifacts and report snapshots (static/history/<run_id>/).
      - testo_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # A copy of the whole history (`testo backup`) once a day, the newest 7 kept, in their
  # own testo_backups volume (not the data volume, so backups never fill the disk the
  # server writes to; put that volume on another disk if you can). Copy them off the machine:
  #   docker compose cp backup:/backups ./testo-backups
  # Restore: docs/Processes & Guides/Team Server.md#backups
  backup:
    image: ghcr.io/taltal-beep/testo-server:${TESTO_SERVER_TAG:-1}
    build:
      context: ../..
      dockerfile: Dockerfile.testo-server
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /backups
        while true; do
          # A backup cut short (full disk, restart) leaves a .partial file: never keep those.
          rm -f /backups/*.partial
          testo backup --out "/backups/testo-$$(date -u +%Y%m%d-%H%M%S).tar.gz" &&
            ls -1t /backups/testo-*.tar.gz | tail -n +$$((TESTO_BACKUP_KEEP + 1)) | xargs -r rm -f --
          sleep "$$TESTO_BACKUP_EVERY_S"
        done
    environment:
      DATABASE_URL: postgresql+psycopg://testo:${POSTGRES_PASSWORD:-testo}@postgres:5432/testo
      TESTO_BACKUP_KEEP: ${TESTO_BACKUP_KEEP:-7}
      TESTO_BACKUP_EVERY_S: ${TESTO_BACKUP_EVERY_S:-86400}
    volumes:
      - testo_data:/data
      - testo_backups:/backups
    # Healthy while the newest backup is younger than two intervals.
    healthcheck:
      test:
        - CMD-SHELL
        - find /backups -name 'testo-*.tar.gz' -mmin -$$((TESTO_BACKUP_EVERY_S / 30 + 1)) | grep -q .
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      # After the server, so the two never fill the new testo_data volume at the same time.
      server:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testo}
      POSTGRES_DB: testo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testo -d testo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  testo_data:
  testo_backups:
  postgres_data:
